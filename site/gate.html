<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Gate — UNIVA Specification Guide</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .gate-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gate-container:hover {
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.18);
    }

    .lock-icon-wrapper {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lock-icon-wrapper:hover {
      transform: scale(1.1) rotate(-5deg);
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5);
    }

    .lock-icon-wrapper i {
      font-size: 40px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .lock-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .lock-subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .prompt-box {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .prompt-box.active {
      display: block;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-align: left;
    }

    .password-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #334155;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .password-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .unlock-btn:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }

    .error-msg.active {
      display: block;
      animation: shake 0.3s ease;
    }

    .success-badge {
      color: #4ade80;
      font-size: 0.9rem;
      font-weight: 700;
      margin-top: 12px;
      display: none;
    }

    .success-badge.active {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <div class="gate-container">
    <div class="lock-icon-wrapper" id="lockTrigger" onclick="togglePrompt()">
      <i class="fa-solid fa-lock" id="lockIcon"></i>
    </div>

    <h1 class="lock-title">UNIVA Documentation Gate</h1>
    <p class="lock-subtitle" id="instructionText">Click the lock icon to enter your password and access the specification manual.</p>

    <div class="prompt-box" id="promptBox">
      <div class="input-group">
        <label class="input-label" for="passwordInput">Enter 16-digit password</label>
        <input 
          type="password" 
          id="passwordInput" 
          class="password-input" 
          placeholder="••••••••••••••••"
          autocomplete="off"
          onkeydown="handleKeyPress(event)"
        >
      </div>
      <button class="unlock-btn" onclick="verifyPassword()">
        <i class="fa-solid fa-key"></i> Unlock Specification
      </button>
      <div class="error-msg" id="errorMsg">
        <i class="fa-solid fa-triangle-exclamation"></i> Incorrect password. Please try again.
      </div>
      <div class="success-badge" id="successMsg">
        <i class="fa-solid fa-circle-check"></i> Access Granted! Redirecting...
      </div>
    </div>
  </div>

  <script>
    function togglePrompt() {
      const promptBox = document.getElementById('promptBox');
      const instructionText = document.getElementById('instructionText');
      const passwordInput = document.getElementById('passwordInput');
      
      promptBox.classList.add('active');
      instructionText.textContent = "Please enter the required authorization password to proceed.";
      passwordInput.focus();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        verifyPassword();
      }
    }

    function verifyPassword() {
      const input = document.getElementById('passwordInput');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const lockIcon = document.getElementById('lockIcon');
      const lockWrapper = document.getElementById('lockTrigger');

      errorMsg.classList.remove('active');

      if (input.value === '0000') {
        // Success
        successMsg.classList.add('active');
        lockIcon.className = 'fa-solid fa-lock-open';
        lockWrapper.style.background = 'linear-gradient(135deg, #16a34a 0%, #22c55e 100%)';
        lockWrapper.style.boxShadow = '0 10px 25px rgba(34, 197, 94, 0.4)';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        // Error
        errorMsg.classList.add('active');
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>
